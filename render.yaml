# Blueprint de Render (infraestructura como código). Ver docs/adr/006-despliegue-coste-cero.md
# Un único servicio web gratuito: la API (Fastify) sirve también el front compilado.
services:
  - type: web
    name: incidapp
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Se despliega al hacer merge en main, solo si la CI de GitHub está en verde.
    autoDeployTrigger: checksPass
    # El build necesita las devDependencies (tsup, Vite, tsx para las migraciones).
    buildCommand: npm ci --include=dev && npm run build
    # El plan gratuito no tiene preDeployCommand: las migraciones y el seed (idempotente, no cambia
    # contraseñas) se aplican al arrancar. El seed crea los departamentos y los usuarios demo.
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Saltos de proxy de confianza para obtener la IP real del cliente (auditoría y límite de intentos).
      # Medido en producción el 23/11/2026: cliente → Cloudflare → balanceador de Render → proxy interno → app.
      # Con 1 salía la IP del proxy interno (10.x) y con 2, la de Cloudflare; con 3, la del cliente.
      # Una IP falseada en X-Forwarded-For queda a la izquierda y no se usa. No subirlo sin medirlo.
      - key: TRUST_PROXY_HOPS
        value: '3'
      # Cadena de conexión de Neon. El valor se pega en el panel de Render, nunca en el repositorio.
      - key: DATABASE_URL
        sync: false
